version: "3.9"

services:
  posthog-postgres:
    image: postgres:16.4-alpine
    container_name: electromax-posthog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTHOG_POSTGRES_DB:-posthog}
      POSTGRES_USER: ${POSTHOG_POSTGRES_USER:-posthog}
      POSTGRES_PASSWORD: ${POSTHOG_POSTGRES_PASSWORD:-posthog}
    expose:
      - "5432"
    volumes:
      - posthog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTHOG_POSTGRES_USER:-posthog} -d ${POSTHOG_POSTGRES_DB:-posthog}"]
      interval: 10s
      timeout: 5s
      retries: 10

  posthog-redis:
    image: redis:7.4-alpine
    container_name: electromax-posthog-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - posthog_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  posthog-zookeeper:
    image: bitnami/zookeeper:3.9.2
    container_name: electromax-posthog-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    expose:
      - "2181"

  posthog-kafka:
    image: bitnami/kafka:3.8.0
    container_name: electromax-posthog-kafka
    restart: unless-stopped
    depends_on:
      - posthog-zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: posthog-zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://posthog-kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    expose:
      - "9092"

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:24.3.12.75
    container_name: electromax-posthog-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${POSTHOG_CLICKHOUSE_DB:-posthog}
      CLICKHOUSE_USER: ${POSTHOG_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${POSTHOG_CLICKHOUSE_PASSWORD:-}
    expose:
      - "8123"
      - "9000"
    volumes:
      - posthog_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  posthog-web:
    image: posthog/posthog:${POSTHOG_VERSION:-1.63.0}
    container_name: electromax-posthog-web
    restart: unless-stopped
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_started
    command: ["./bin/docker-web"]
    env_file:
      - ../.env.analytics
    environment:
      DATABASE_URL: postgres://${POSTHOG_POSTGRES_USER:-posthog}:${POSTHOG_POSTGRES_PASSWORD:-posthog}@posthog-postgres:5432/${POSTHOG_POSTGRES_DB:-posthog}
      REDIS_URL: redis://posthog-redis:6379/
      SECRET_KEY: ${POSTHOG_SECRET_KEY}
      SITE_URL: ${POSTHOG_SITE_URL:-https://posthog.electromax.local}
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: ${POSTHOG_CLICKHOUSE_DB:-posthog}
      KAFKA_HOSTS: posthog-kafka:9092
      IS_BEHIND_PROXY: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/_health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 60s

  posthog-worker:
    image: posthog/posthog:${POSTHOG_VERSION:-1.63.0}
    container_name: electromax-posthog-worker
    restart: unless-stopped
    depends_on:
      posthog-web:
        condition: service_healthy
    command: ["./bin/docker-worker"]
    env_file:
      - ../.env.analytics
    environment:
      DATABASE_URL: postgres://${POSTHOG_POSTGRES_USER:-posthog}:${POSTHOG_POSTGRES_PASSWORD:-posthog}@posthog-postgres:5432/${POSTHOG_POSTGRES_DB:-posthog}
      REDIS_URL: redis://posthog-redis:6379/
      SECRET_KEY: ${POSTHOG_SECRET_KEY}
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: ${POSTHOG_CLICKHOUSE_DB:-posthog}
      KAFKA_HOSTS: posthog-kafka:9092

  posthog-plugins:
    image: posthog/posthog:${POSTHOG_VERSION:-1.63.0}
    container_name: electromax-posthog-plugins
    restart: unless-stopped
    depends_on:
      posthog-web:
        condition: service_healthy
    command: ["./bin/docker-plugins"]
    env_file:
      - ../.env.analytics
    environment:
      DATABASE_URL: postgres://${POSTHOG_POSTGRES_USER:-posthog}:${POSTHOG_POSTGRES_PASSWORD:-posthog}@posthog-postgres:5432/${POSTHOG_POSTGRES_DB:-posthog}
      REDIS_URL: redis://posthog-redis:6379/
      SECRET_KEY: ${POSTHOG_SECRET_KEY}
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: ${POSTHOG_CLICKHOUSE_DB:-posthog}
      KAFKA_HOSTS: posthog-kafka:9092

  analytics-proxy:
    image: caddy:2.8.4-alpine
    container_name: electromax-analytics-proxy
    restart: unless-stopped
    depends_on:
      posthog-web:
        condition: service_healthy
    environment:
      POSTHOG_DOMAIN: ${POSTHOG_DOMAIN:-posthog.electromax.local}
      ACME_EMAIL: ${ACME_EMAIL:-devops@electromax.local}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile.analytics:/etc/caddy/Caddyfile:ro
      - posthog_caddy_data:/data
      - posthog_caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  posthog_pg_data:
  posthog_redis_data:
  posthog_clickhouse_data:
  posthog_caddy_data:
  posthog_caddy_config:
